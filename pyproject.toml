[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "playerlens"
version = "0.1.0"
description = "Local, evidence-based exploration of Steam player feedback"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["pandas>=2.2.3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
playerlens = "playerlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
